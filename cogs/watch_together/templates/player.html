<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Together - 동시 시청</title>
    <link rel="stylesheet" href="/watch-assets/watch.css">
</head>
<body>

    <header class="app-header">
        <div class="app-header__inner">
            <div class="brand-lockup">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M8 7.5v9l8-4.5-8-4.5Z" fill="currentColor"/>
                    </svg>
                </div>
                <div class="brand-copy">
                    <p class="brand-title">Watch Together</p>
                    <p class="brand-subtitle">YouTube 동시 시청</p>
                </div>
            </div>
            <div class="status-container">
                <div
                    id="connection-badge"
                    class="badge badge-ws disconnected"
                    role="status"
                    aria-live="polite"
                >
                    <span class="dot" aria-hidden="true"></span>
                    <span id="ws-status-text">연결 대기 중</span>
                </div>
            </div>
        </div>
    </header>

    <main class="app-shell">
        <section class="player-section" aria-labelledby="watch-heading">
            <header class="section-heading">
                <div class="section-heading__copy">
                    <span class="eyebrow">공유 플레이어</span>
                    <h1 id="watch-heading">함께 보기</h1>
                    <p class="section-description">
                        재생, 일시정지와 탐색 위치가 현재 참여자에게 공유됩니다.
                    </p>
                </div>
            </header>

            <div class="video-frame">
                <div class="video-wrapper">
                    <div id="yt-player"></div>
                </div>
            </div>

            <div class="video-info" aria-live="polite">
                <span class="now-playing-indicator" aria-hidden="true"></span>
                <div class="video-copy">
                    <p id="current-video-title" class="video-title">
                        대기열에서 영상을 선택하거나 추가해 주세요.
                    </p>
                    <p class="sync-note">
                        영상 조작은 같은 시청방의 참여자에게 동기화됩니다.
                    </p>
                </div>
            </div>
        </section>

        <aside class="sidebar-section" aria-label="시청방 도구">
            <section class="card playlist-card" aria-labelledby="playlist-heading">
                <header class="panel-heading">
                    <div>
                        <h2 id="playlist-heading">재생 대기열</h2>
                        <p class="panel-description">YouTube 영상을 추가하고 재생 순서를 확인합니다.</p>
                    </div>
                </header>

                <div class="input-group">
                    <label class="visually-hidden" for="youtube-url-input">YouTube 영상 주소</label>
                    <input
                        type="url"
                        id="youtube-url-input"
                        inputmode="url"
                        autocomplete="url"
                        placeholder="YouTube 영상 주소"
                    >
                    <button class="btn" id="add-video-btn" type="button">추가</button>
                </div>

                <ul
                    class="playlist-items"
                    id="playlist-items-ul"
                    aria-label="공유 재생 대기열"
                ></ul>
            </section>

            <section class="card chat-card" aria-labelledby="chat-heading">
                <header class="panel-heading">
                    <div>
                        <h2 id="chat-heading">대화</h2>
                        <p class="panel-description">시청방에 접속한 참여자와 메시지를 나눕니다.</p>
                    </div>
                </header>

                <div class="participants">
                    <span class="participants__label">참여자</span>
                    <div id="users-badge-list" aria-live="polite"></div>
                </div>

                <div
                    id="chat-messages"
                    role="log"
                    aria-live="polite"
                    aria-relevant="additions"
                    aria-label="시청방 대화"
                ></div>

                <div class="input-group">
                    <label class="visually-hidden" for="chat-input">메시지</label>
                    <input
                        type="text"
                        id="chat-input"
                        maxlength="500"
                        autocomplete="off"
                        placeholder="메시지 입력"
                    >
                    <button class="btn btn--secondary" id="send-chat-btn" type="button">전송</button>
                </div>
            </section>
        </aside>
    </main>

    <div
        id="toast-message"
        class="toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
    ></div>

    <!-- YouTube IFrame API 비동기 로드 -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // 세션 ID 추출 (URL 파라미터에서 추출)
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        
        if (!sessionId) {
            alert("세션 ID가 존재하지 않습니다. 정상적인 주소로 접속해 주세요.");
            window.stop();
        }

        // 닉네임 설정 (무작위 닉네임 생성 및 유지)
        const addedBy = "유저_" + Math.floor(Math.random() * 1000);

        let player;
        let ws;
        let currentVideoId = null;
        let isSyncing = false; // 동기화 패킷 처리 중 무한 루프 차단 플래그
        let lastReceivedTime = 0;
        let playlist = [];

        // 1. YouTube IFrame API 로드 성공 시 호출되는 콜백
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: '', // 최초 로드 시 빈 영상
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0,
                    'modestbranding': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            initWebSocket();
            fetchPlaylist();
        }

        // 사용자가 수동으로 조작했는지 확인하기 위한 플래그
        let userAction = true;

        // 플레이어 상태 감지 및 서버 전송
        function onPlayerStateChange(event) {
            if (isSyncing) return; // 동기화 패킷에 의한 상태 변경이면 무시

            const time = player.getCurrentTime();
            if (event.data === YT.PlayerState.PLAYING) {
                sendWsMessage({
                    type: "state_change",
                    state: "playing",
                    time: time
                });
            } else if (event.data === YT.PlayerState.PAUSED) {
                sendWsMessage({
                    type: "state_change",
                    state: "paused",
                    time: time
                });
            } else if (event.data === YT.PlayerState.ENDED) {
                // 영상 재생이 끝났을 때 자동 다음 비디오 재생
                playNextVideo();
            }
        }

        // 대기열의 다음 비디오 자동 재생 처리
        function playNextVideo() {
            if (playlist.length === 0) return;
            
            // 현재 활성화된 비디오의 인덱스 조회
            const currentIndex = playlist.findIndex(item => extractVideoId(item.video_url) === currentVideoId);
            
            // 다음 비디오가 존재할 경우 로드 후 전체 유저에게 브로드캐스트
            if (currentIndex !== -1 && currentIndex + 1 < playlist.length) {
                const nextItem = playlist[currentIndex + 1];
                const nextVideoId = extractVideoId(nextItem.video_url);
                if (nextVideoId) {
                    appendSystemMessage("🎵 재생이 완료되어 다음 대기열 동영상을 자동으로 재생합니다.");
                    loadVideoById(nextVideoId, true);
                }
            } else {
                appendSystemMessage("📭 대기열의 모든 동영상 재생이 끝났습니다.");
            }
        }

        // 주기적인 재생 지점(Seek) 동기화 트리거
        let prevTime = 0;
        setInterval(() => {
            if (!player || isSyncing || !player.getCurrentTime) return;
            const currTime = player.getCurrentTime();
            const state = player.getPlayerState();
            
            if (state === YT.PlayerState.PLAYING) {
                const diff = Math.abs(currTime - prevTime);
                if (diff > 2.5) {
                    sendWsMessage({
                        type: "seek",
                        time: currTime
                    });
                }
            }
            prevTime = currTime;
        }, 800);

        // 2. WebSocket 초기화 및 통신 핸들러
        function initWebSocket() {
            const loc = window.location;
            const wsProto = loc.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${wsProto}//${loc.host}/ws/${sessionId}`;
            
            ws = new WebSocket(wsUrl);

            const badge = document.getElementById("connection-badge");
            const badgeText = document.getElementById("ws-status-text");

            ws.onopen = () => {
                badge.className = "badge badge-ws";
                badgeText.innerText = "실시간 동기화 됨";
                showToast("실시간 동기화가 활성화되었습니다.");
                
                // 닉네임을 서버에 보내 가입(Join)을 완료시킴
                sendWsMessage({
                    type: "join",
                    username: addedBy
                });
            };

            ws.onclose = () => {
                badge.className = "badge badge-ws disconnected";
                badgeText.innerText = "연결 끊김 (재시도 중)";
                showToast("연결이 종료되었습니다. 3초 후 재연결을 시도합니다.");
                setTimeout(initWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error("WS Error:", err);
            };

            ws.onmessage = async (event) => {
                const message = JSON.parse(event.data);
                
                isSyncing = true; // 무한 동기화 루프 방지 ON

                switch (message.type) {
                    case "user_joined":
                        showToast(message.message);
                        appendSystemMessage(message.message);
                        // 내가 방의 선구자(기존 플레이어)라면 신입에게 현재 플레이 상태를 전달
                        if (player && player.getPlayerState() !== YT.PlayerState.UNSTARTED && player.getPlayerState() !== -1) {
                            sendWsMessage({
                                type: "sync_response",
                                state: player.getPlayerState() === YT.PlayerState.PLAYING ? "playing" : "paused",
                                time: player.getCurrentTime(),
                                videoId: currentVideoId
                            });
                        }
                        break;

                    case "user_left":
                        showToast(message.message);
                        appendSystemMessage(message.message);
                        break;

                    case "user_list":
                        updateUsersList(message.users);
                        break;

                    case "chat":
                        appendChatMessage(message.username, message.text);
                        break;

                    case "state_change":
                        syncPlayerState(message.state, message.time);
                        appendSystemMessage(`ℹ️ 누군가 동영상을 ${message.state === 'playing' ? '재생' : '일시정지'}했습니다.`);
                        break;

                    case "seek":
                        syncPlayerSeek(message.time);
                        appendSystemMessage(`ℹ️ 누군가 재생 구간을 건너뛰었습니다.`);
                        break;

                    case "sync_request":
                        // 누군가 싱크를 요청할 때 내 상태 전송
                        if (player && player.getPlayerState() !== -1) {
                            sendWsMessage({
                                type: "sync_response",
                                state: player.getPlayerState() === YT.PlayerState.PLAYING ? "playing" : "paused",
                                time: player.getCurrentTime(),
                                videoId: currentVideoId
                            });
                        }
                        break;

                    case "sync_response":
                        // 받아온 타겟 비디오와 현재 비디오가 다르면 영상 변경
                        if (message.videoId && message.videoId !== currentVideoId) {
                            loadVideoById(message.videoId, false);
                        }
                        // 상태 및 시각 강제 동기화
                        syncPlayerState(message.state, message.time);
                        break;

                    case "playlist_change":
                        showToast(message.message);
                        appendSystemMessage(message.message);
                        fetchPlaylist();
                        break;
                }

                // 동기화 명령 처리 후 살짝 텀을 두고 플래그 해제
                setTimeout(() => { isSyncing = false; }, 400);
            };
        }

        function sendWsMessage(obj) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(obj));
            }
        }

        // 3. 브라우저 비디오 컨트롤 동기화 실행 (역치 필터링 포함)
        function syncPlayerState(targetState, targetTime) {
            if (!player) return;
            
            const currTime = player.getCurrentTime();
            const timeDiff = Math.abs(currTime - targetTime);

            // 오차 강제 교정 역치 (1.5초)
            if (timeDiff > 1.5) {
                player.seekTo(targetTime, true);
            }

            if (targetState === "playing") {
                if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
                    player.playVideo();
                }
            } else if (targetState === "paused") {
                if (player.getPlayerState() !== YT.PlayerState.PAUSED) {
                    player.pauseVideo();
                }
            }
        }

        function syncPlayerSeek(targetTime) {
            if (!player) return;
            const currTime = player.getCurrentTime();
            const timeDiff = Math.abs(currTime - targetTime);
            
            // 오차가 1.5초 이상 벌어질 때만 화면 튐(Seek) 적용
            if (timeDiff > 1.5) {
                player.seekTo(targetTime, true);
            }
        }

        // 4. 동영상 제어 유틸 함수
        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadVideoById(videoId, triggerWs = true) {
            if (!player) return;
            currentVideoId = videoId;
            player.loadVideoById(videoId);
            
            // 현재 대기열의 항목 이름으로 뷰 갱신
            const activeItem = playlist.find(item => extractVideoId(item.video_url) === videoId);
            if (activeItem) {
                document.getElementById("current-video-title").innerText = activeItem.video_title;
                highlightPlaylistItem(activeItem.video_url);
            }

            if (triggerWs) {
                sendWsMessage({
                    type: "sync_response",
                    state: "playing",
                    time: 0,
                    videoId: videoId
                });
            }
        }

        // 5. 플레이리스트 데이터 연동 API 호출
        async function fetchPlaylist() {
            try {
                const response = await fetch(`/api/playlist/${sessionId}`);
                if (response.ok) {
                    const data = await response.json();
                    playlist = data.playlist;
                    renderPlaylist();
                }
            } catch (err) {
                console.error("Failed to fetch playlist:", err);
            }
        }

        function renderPlaylist() {
            const ul = document.getElementById("playlist-items-ul");
            ul.replaceChildren();

            if (playlist.length === 0) {
                const emptyItem = document.createElement("li");
                emptyItem.className = "playlist-empty";
                emptyItem.textContent = "대기열이 비어 있습니다.";
                ul.appendChild(emptyItem);
                return;
            }

            playlist.forEach((item, index) => {
                const videoId = extractVideoId(item.video_url);
                if (!videoId) return;

                const li = document.createElement("li");
                li.className = "playlist-item";
                if (videoId === currentVideoId) {
                    li.classList.add("active");
                }

                const thumbnailWrapper = document.createElement("div");
                thumbnailWrapper.className = "item-thumb-wrapper";
                const thumbnail = document.createElement("img");
                thumbnail.src = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
                thumbnail.alt = `${item.video_title} 미리보기`;
                thumbnailWrapper.appendChild(thumbnail);

                const itemInfo = document.createElement("div");
                itemInfo.className = "item-info";
                itemInfo.tabIndex = 0;
                itemInfo.setAttribute("role", "button");
                itemInfo.setAttribute("aria-label", `${item.video_title} 재생`);
                itemInfo.addEventListener("click", () => {
                    playPlaylistVideo(videoId);
                });
                itemInfo.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        playPlaylistVideo(videoId);
                    }
                });

                const title = document.createElement("div");
                title.className = "item-title";
                title.textContent = item.video_title;
                const metadata = document.createElement("div");
                metadata.className = "item-meta";
                metadata.textContent = `추가자: ${item.added_by}`;
                itemInfo.append(title, metadata);

                const removeButton = document.createElement("button");
                removeButton.className = "btn-danger";
                removeButton.textContent = "삭제";
                removeButton.type = "button";
                removeButton.setAttribute("aria-label", `${item.video_title} 대기열에서 삭제`);
                removeButton.addEventListener("click", (event) => {
                    removeVideo(event, item.video_url);
                });

                li.append(thumbnailWrapper, itemInfo, removeButton);
                ul.appendChild(li);
            });
        }

        function playPlaylistVideo(videoId) {
            if (videoId) {
                loadVideoById(videoId, true);
            }
        }

        function highlightPlaylistItem(videoUrl) {
            const items = document.querySelectorAll(".playlist-item");
            items.forEach(item => item.classList.remove("active"));
            
            // 비디오 URL 매칭 활성화 클래스 부여
            playlist.forEach((item, index) => {
                if (item.video_url === videoUrl) {
                    const el = document.getElementById("playlist-items-ul").children[index];
                    if (el) el.classList.add("active");
                }
            });
        }

        // 비디오 삭제 요청
        async function removeVideo(event, videoUrl) {
            event.stopPropagation(); // li 클릭 이벤트 버블링 차단
            
            try {
                const response = await fetch(`/api/playlist/${sessionId}/remove?video_url=${encodeURIComponent(videoUrl)}`, {
                    method: "POST"
                });
                if (response.ok) {
                    fetchPlaylist();
                }
            } catch (err) {
                console.error("Failed to remove video:", err);
            }
        }

        // 비디오 추가 기능 수행
        async function addVideoFromInput() {
            const input = document.getElementById("youtube-url-input");
            const url = input.value.trim();
            if (!url) return;

            const videoId = extractVideoId(url);
            if (!videoId) {
                alert("유효한 유튜브 동영상 주소를 입력해 주세요.");
                return;
            }

            try {
                const response = await fetch(`/api/playlist/${sessionId}/add`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        video_url: url,
                        added_by: addedBy
                    })
                });

                if (response.ok) {
                    input.value = "";
                    fetchPlaylist();
                    showToast("대기열에 동영상을 성공적으로 추가했습니다.");
                    
                    if (!currentVideoId) {
                        setTimeout(() => {
                            loadVideoById(videoId, true);
                        }, 500);
                    }
                }
            } catch (err) {
                console.error("Failed to add video:", err);
            }
        }

        // 비디오 추가 버튼 클릭 핸들러
        document.getElementById("add-video-btn").onclick = addVideoFromInput;

        // 비디오 추가 입력창 Enter 키 바인딩
        document.getElementById("youtube-url-input").onkeypress = (event) => {
            if (event.key === 'Enter') {
                addVideoFromInput();
            }
        };

        // 6. 실시간 채팅 UI 연동 및 이벤트 핸들러
        document.getElementById("chat-input").onkeypress = (event) => {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        };

        document.getElementById("send-chat-btn").onclick = sendChatMessage;

        function sendChatMessage() {
            const input = document.getElementById("chat-input");
            const text = input.value.trim();
            if (!text) return;

            // 로컬 화면에 즉시 렌더링
            appendChatMessage(addedBy, text);

            // 전체 방 참여자들에게 웹소켓 중계 발송
            sendWsMessage({
                type: "chat",
                username: addedBy,
                text: text
            });

            input.value = "";
        }

        function appendChatMessage(sender, text) {
            const container = document.getElementById("chat-messages");
            const el = document.createElement("div");
            el.className = "chat-message";
            const user = document.createElement("span");
            user.className = "chat-user";
            user.textContent = `${sender}:`;
            const message = document.createElement("span");
            message.className = "chat-text";
            message.textContent = text;
            el.append(user, message);
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        function appendSystemMessage(msg) {
            const container = document.getElementById("chat-messages");
            const el = document.createElement("div");
            el.className = "chat-message system-message";
            el.innerText = msg;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        // 참여자 목록 갱신
        function updateUsersList(users) {
            const listEl = document.getElementById("users-badge-list");
            listEl.replaceChildren();
            users.forEach(user => {
                const badge = document.createElement("span");
                badge.className = "user-badge";
                badge.textContent = user;
                listEl.appendChild(badge);
            });
        }

        // 7. 유틸성 알림 메신저 (Toast)
        function showToast(msg) {
            const toast = document.getElementById("toast-message");
            toast.innerText = msg;
            toast.classList.add("show");
            setTimeout(() => {
                toast.className = "toast";
            }, 3000);
        }
    </script>
</body>
</html>
