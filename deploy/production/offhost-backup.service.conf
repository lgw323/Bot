# Reviewed opt-in drop-in. Do not install until the production gate is approved.
# Apply only to discordbot-backup.service. Update/manual and the ops wrapper
# require these LoadCredential lines too, preserving their existing timeouts.
[Service]
LoadCredential=backup_ssh_key:/etc/discordbot/backup-ssh/id_ed25519
LoadCredential=known_hosts:/etc/discordbot/backup-ssh/known_hosts
TimeoutStartSec=300
TimeoutStopSec=130
